[workspace]
resolver = "2"
members = [
  "main/port/composite",
  "main/port/config",
  "main/port/egress",
  "main/port/health",
  "main/port/ingress",
  "main/port/json",
  "main/port/metrics",
  "main/port/monitor",
  "main/port/runner",
  "main/port/runtime",
  "main/port/validator",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge-bootstrap"

[package]
name         = "swe-edge-bootstrap"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description  = "edge — process-level assembler: wires ingress + proxy + domain + egress, lifecycle, and systemd notify."
keywords     = ["daemon", "runtime", "lifecycle", "systemd", "swe"]
categories   = ["network-programming"]

[package.metadata.arch]
application_type = "gateway"
service_type     = "runtime"

[package.metadata.struct-engine]
application_type = "gateway"
service_type     = "runtime"

[lib]
name = "swe_edge_bootstrap"
path = "main/src/lib.rs"

[features]
default        = []
observability  = ["dep:tracing-subscriber", "swe-edge-observ-config/observability", "swe-edge-bootstrap-runtime/observability"]
message-broker = ["dep:swe-edge-runtime-message-broker", "swe-edge-bootstrap-runtime/message-broker"]
scheduler      = ["dep:swe-edge-runtime-scheduler", "swe-edge-bootstrap-runtime/scheduler"]
security       = ["dep:edge-security-runtime", "dep:edge-security-runtime-credential", "dep:edge-security-runtime-authz", "dep:edge-security-runtime-tls"]

[dependencies]
swe-edge-bootstrap-composite = { path = "main/port/composite" }
swe-edge-bootstrap-config     = { path = "main/port/config" }
swe-edge-bootstrap-egress     = { path = "main/port/egress" }
swe-edge-bootstrap-health     = { path = "main/port/health" }
swe-edge-bootstrap-ingress    = { path = "main/port/ingress" }
swe-edge-bootstrap-json       = { path = "main/port/json" }
swe-edge-bootstrap-metrics    = { path = "main/port/metrics" }
swe-edge-bootstrap-monitor    = { path = "main/port/monitor" }
swe-edge-bootstrap-runner     = { path = "main/port/runner" }
swe-edge-bootstrap-runtime    = { path = "main/port/runtime" }
swe-edge-bootstrap-validator  = { path = "main/port/validator" }

async-trait        = "0.1"
dirs               = "5"
futures            = "0.3"
parking_lot        = "0.12"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
thiserror          = "2"
tokio              = { version = "1.0", features = ["rt-multi-thread", "sync", "signal", "macros", "time", "net", "test-util"] }
toml               = "0.8"
tracing            = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

swe-edge-configbuilder           = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git",  tag = "v0.4.2" }
swe-edge-observ-config           = { git = "https://github.com/sweengineeringlabs/edge-observ-config.git",  tag = "v0.2.1" }
swe-edge-runtime-message-broker  = { git = "https://github.com/sweengineeringlabs/edge-runtime.git", tag = "v0.3.16", features = ["tokio-rt"], optional = true }
swe-edge-runtime-scheduler       = { git = "https://github.com/sweengineeringlabs/edge-scheduler.git", tag = "v0.3.6", optional = true }
edge-security-runtime             = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.7", optional = true }
edge-security-runtime-credential  = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.7", optional = true }
edge-security-runtime-authz       = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.7", optional = true }
edge-security-runtime-tls         = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.7", optional = true }

edge-proxy                       = { git = "https://github.com/sweengineeringlabs/edge-proxy.git", tag = "v0.3.5" }
swe-edge-ingress-http            = { package = "edge-transport-http-ingress-transport", git = "https://github.com/sweengineeringlabs/edge-ingress-http.git", tag = "v0.5.3" }
swe-edge-ingress-grpc            = { package = "swe-edge-ingress-grpc-transport", git = "https://github.com/sweengineeringlabs/edge-ingress-grpc.git", tag = "v0.6.3" }
swe-edge-runtime-grpc            = { git = "https://github.com/sweengineeringlabs/edge-runtime.git", tag = "v0.3.17" }
swe-edge-runtime-http            = { git = "https://github.com/sweengineeringlabs/edge-runtime.git", tag = "v0.3.17" }
swe-edge-egress-grpc             = { package = "swe-edge-egress-grpc-transport", git = "https://github.com/sweengineeringlabs/edge-egress-grpc.git", tag = "v0.5.0" }
swe-edge-egress-http             = { package = "edge-transport-http-egress-transport", git = "https://github.com/sweengineeringlabs/edge-egress-http.git", tag = "v0.4.5" }
swe-edge-ingress-verifier        = { git = "https://github.com/sweengineeringlabs/edge-ingress-security.git", tag = "v0.6.3" }
swe-edge-ingress-grpc-reflection = { git = "https://github.com/sweengineeringlabs/edge-ingress-grpc.git", tag = "v0.6.3" }
edge-domain                      = { git = "https://github.com/sweengineeringlabs/edge-application.git", tag = "v0.18.0", package = "edge-application", features = ["full"] }
edge-dispatch                    = { package = "edge-dispatcher", git = "https://github.com/sweengineeringlabs/edge-dispatcher.git", tag = "v0.11.2" }
swe-observ-metrics               = { package = "swe-observability-metrics", git = "ssh://git@github.com/sweengineeringlabs/justobserv.git", tag = "v0.2.9" }

[[example]]
name = "hello_edge"
path = "examples/hello_edge.rs"

[dev-dependencies]
async-trait                = "0.1"
edge-application-handler  = { git = "https://github.com/sweengineeringlabs/edge-application.git", tag = "v0.18.0" }
edge-application-observer = { git = "https://github.com/sweengineeringlabs/edge-application.git", tag = "v0.18.0" }
reqwest           = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
serde             = { version = "1.0", features = ["derive"] }
tempfile          = "3"
tokio             = { version = "1.0", features = ["rt-multi-thread", "sync", "signal", "macros", "time", "net", "test-util"] }
swe-edge-configbuilder          = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.4.2" }
swe-edge-observ-config          = { git = "https://github.com/sweengineeringlabs/edge-observ-config.git", tag = "v0.2.1" }
swe-edge-runtime-message-broker = { git = "https://github.com/sweengineeringlabs/edge-runtime.git", tag = "v0.3.16", features = ["tokio-rt"] }
swe-edge-runtime-scheduler      = { git = "https://github.com/sweengineeringlabs/edge-scheduler.git", tag = "v0.3.6" }
edge-proxy                      = { git = "https://github.com/sweengineeringlabs/edge-proxy.git", tag = "v0.3.5" }
swe-edge-ingress-http           = { package = "edge-transport-http-ingress-transport", git = "https://github.com/sweengineeringlabs/edge-ingress-http.git", tag = "v0.5.3" }
swe-edge-ingress-grpc           = { package = "swe-edge-ingress-grpc-transport", git = "https://github.com/sweengineeringlabs/edge-ingress-grpc.git", tag = "v0.6.3" }
swe-edge-runtime-grpc           = { git = "https://github.com/sweengineeringlabs/edge-runtime.git", tag = "v0.3.17" }
swe-edge-runtime-http           = { git = "https://github.com/sweengineeringlabs/edge-runtime.git", tag = "v0.3.17" }
swe-edge-egress-grpc            = { package = "swe-edge-egress-grpc-transport", git = "https://github.com/sweengineeringlabs/edge-egress-grpc.git", tag = "v0.5.0" }
swe-edge-egress-http            = { package = "edge-transport-http-egress-transport", git = "https://github.com/sweengineeringlabs/edge-egress-http.git", tag = "v0.4.5" }
edge-domain                     = { git = "https://github.com/sweengineeringlabs/edge-application.git", tag = "v0.18.0", package = "edge-application", features = ["full"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace]
resolver = "2"
members = [
  "main/port/composite",
  "main/port/config",
  "main/port/egress",
  "main/port/health",
  "main/port/ingress",
  "main/port/intrusion",
  "main/port/json",
  "main/port/metrics",
  "main/port/monitor",
  "main/port/runner",
  "main/port/runtime",
  "main/port/validator",
  "main/adapter",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge-bootstrap"

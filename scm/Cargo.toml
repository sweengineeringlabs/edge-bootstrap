[package]
name         = "swe-edge-bootstrap"
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge-bootstrap"
description  = "edge — process-level assembler: wires ingress + proxy + domain + egress, lifecycle, and systemd notify."
keywords     = ["daemon", "runtime", "lifecycle", "systemd", "swe"]
categories   = ["network-programming"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "runtime"

[lib]
name = "swe_edge_bootstrap"
path = "main/src/lib.rs"

[features]
default        = []
observability  = ["dep:tracing-subscriber", "swe-edge-observ-config/observability"]
message-broker = ["dep:swe-edge-runtime-message-broker"]
scheduler      = ["dep:swe-edge-runtime-scheduler"]
security       = ["dep:swe-edge-security"]

[dependencies]
async-trait        = "0.1"
dirs               = "5"
futures            = "0.3"
parking_lot        = "0.12"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
thiserror          = "2"
tokio              = { version = "1.0", features = ["rt-multi-thread", "sync", "signal", "macros", "time", "net", "test-util"] }
toml               = "0.8"
tracing            = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

swe-edge-configbuilder           = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git",  tag = "v0.4.1" }
swe-edge-observ-config           = { git = "https://github.com/sweengineeringlabs/edge-observ-config.git",  tag = "v0.2.1" }
swe-edge-runtime-message-broker  = { git = "https://github.com/sweengineeringlabs/edge-runtime.git", tag = "v0.3.12", features = ["tokio-rt"], optional = true }
swe-edge-runtime-scheduler       = { git = "https://github.com/sweengineeringlabs/edge-scheduler.git", tag = "v0.3.6", optional = true }
swe-edge-security                = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.3", optional = true }

edge-proxy                       = { git = "https://github.com/sweengineeringlabs/edge-proxy.git", tag = "v0.3.5" }
swe-edge-ingress-http            = { package = "swe-edge-ingress-http-transport", git = "https://github.com/sweengineeringlabs/edge-ingress-http.git", tag = "v0.5.1" }
swe-edge-ingress-grpc            = { package = "swe-edge-ingress-grpc-transport", git = "https://github.com/sweengineeringlabs/edge-ingress-grpc.git", tag = "v0.6.1" }
swe-edge-egress-grpc             = { package = "swe-edge-egress-grpc-transport", git = "https://github.com/sweengineeringlabs/edge-egress-grpc.git", tag = "v0.5.0" }
swe-edge-egress-http             = { package = "swe-edge-egress-http-transport", git = "https://github.com/sweengineeringlabs/edge-egress-http.git", tag = "v0.4.2" }
swe-edge-ingress-verifier        = { git = "https://github.com/sweengineeringlabs/edge-ingress-security.git", tag = "v0.6.3" }
swe-edge-ingress-grpc-reflection = { git = "https://github.com/sweengineeringlabs/edge-ingress-grpc.git", tag = "v0.6.1" }
edge-domain                      = { git = "https://github.com/sweengineeringlabs/edge-application.git", tag = "v0.18.0", package = "edge-application", features = ["full"] }
edge-dispatch                    = { package = "edge-dispatcher", git = "https://github.com/sweengineeringlabs/edge-dispatcher.git", tag = "v0.11.1" }
swe-observ-metrics               = { package = "swe_justobserv_metrics", git = "ssh://git@github.com/sweengineeringlabs/justobserv.git", tag = "v0.2.1" }

[[example]]
name = "hello_edge"
path = "examples/hello_edge.rs"

[dev-dependencies]
async-trait       = "0.1"
edge-llm-provider = { git = "https://github.com/sweengineeringlabs/edge-llm.git", branch = "main" }
reqwest           = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
serde             = { version = "1.0", features = ["derive"] }
tempfile          = "3"
tokio             = { version = "1.0", features = ["rt-multi-thread", "sync", "signal", "macros", "time", "net", "test-util"] }
swe-edge-configbuilder          = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.4.1" }
swe-edge-observ-config          = { git = "https://github.com/sweengineeringlabs/edge-observ-config.git", tag = "v0.2.1" }
swe-edge-runtime-message-broker = { git = "https://github.com/sweengineeringlabs/edge-runtime.git", tag = "v0.3.12", features = ["tokio-rt"] }
swe-edge-runtime-scheduler      = { git = "https://github.com/sweengineeringlabs/edge-scheduler.git", tag = "v0.3.6" }
edge-proxy                      = { git = "https://github.com/sweengineeringlabs/edge-proxy.git", tag = "v0.3.5" }
swe-edge-ingress-http           = { package = "swe-edge-ingress-http-transport", git = "https://github.com/sweengineeringlabs/edge-ingress-http.git", tag = "v0.5.1" }
swe-edge-ingress-grpc           = { package = "swe-edge-ingress-grpc-transport", git = "https://github.com/sweengineeringlabs/edge-ingress-grpc.git", tag = "v0.6.1" }
swe-edge-egress-grpc            = { package = "swe-edge-egress-grpc-transport", git = "https://github.com/sweengineeringlabs/edge-egress-grpc.git", tag = "v0.5.0" }
swe-edge-egress-http            = { package = "swe-edge-egress-http-transport", git = "https://github.com/sweengineeringlabs/edge-egress-http.git", tag = "v0.4.2" }
edge-domain                     = { git = "https://github.com/sweengineeringlabs/edge-application.git", tag = "v0.18.0", package = "edge-application", features = ["full"] }


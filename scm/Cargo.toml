[package]
name         = "swe-edge-bootstrap"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace     = true
repository.workspace  = true
description  = "edge — process-level assembler: wires ingress + proxy + domain + egress, lifecycle, and systemd notify."
keywords     = ["daemon", "runtime", "lifecycle", "systemd", "swe"]
categories   = ["network-programming"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "runtime"

[lib]
name = "swe_edge_bootstrap"
path = "main/src/lib.rs"

[features]
default        = []
observability  = ["dep:tracing-subscriber", "swe-edge-observ-config/observability"]
message-broker = ["dep:swe-edge-runtime-message-broker"]
scheduler      = ["dep:swe-edge-runtime-scheduler"]
security       = ["dep:swe-edge-security"]

[dependencies]
async-trait  = { workspace = true }
dirs         = { workspace = true }
futures      = { workspace = true }
parking_lot  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
toml         = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

swe-edge-configbuilder           = { workspace = true }
swe-edge-observ-config           = { workspace = true }
swe-edge-runtime-message-broker  = { workspace = true, optional = true }
swe-edge-runtime-scheduler       = { workspace = true, optional = true }
swe-edge-security                = { workspace = true, optional = true }

edge-proxy                       = { workspace = true }
swe-edge-ingress-http            = { workspace = true }
swe-edge-ingress-grpc            = { workspace = true }
swe-edge-egress-grpc             = { workspace = true }
swe-edge-egress-http             = { workspace = true }
swe-edge-ingress-verifier        = { workspace = true }
swe-edge-ingress-grpc-reflection = { workspace = true }
edge-domain                      = { workspace = true }
edge-dispatch                    = { workspace = true }
swe-observ-metrics               = { workspace = true }

[dev-dependencies]
async-trait    = { workspace = true }
reqwest        = { workspace = true }
serde          = { workspace = true }
tempfile       = { workspace = true }
tokio          = { workspace = true }
swe-edge-configbuilder          = { workspace = true }
swe-edge-observ-config          = { workspace = true }
swe-edge-runtime-message-broker = { workspace = true }
swe-edge-runtime-scheduler      = { workspace = true }
edge-proxy                      = { workspace = true }
swe-edge-ingress-http           = { workspace = true }
swe-edge-ingress-grpc           = { workspace = true }
swe-edge-egress-grpc            = { workspace = true }
swe-edge-egress-http            = { workspace = true }


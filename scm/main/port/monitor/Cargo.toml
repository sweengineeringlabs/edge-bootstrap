[package]
name                   = "swe-edge-bootstrap-monitor"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description = "swe-edge-bootstrap — load-monitoring ports (traits + DTOs, zero implementation)"
keywords    = ["monitor", "load", "ports"]
categories  = ["network-programming"]

[package.metadata.arch]
application_type = "port"
service_type     = "port"

[lib]
name = "swe_edge_bootstrap_monitor"
path = "src/lib.rs"

[dependencies]
edge-proxy         = { git = "https://github.com/sweengineeringlabs/edge-proxy.git", tag = "v0.3.7" }
parking_lot         = "0.12"
serde               = { version = "1.0", features = ["derive"] }
swe-edge-ingress-grpc = { package = "edge-transport-grpc-ingress-transport", git = "https://github.com/sweengineeringlabs/edge-transport-grpc-ingress.git", tag = "v0.9.1" }
swe-edge-ingress-http = { package = "edge-transport-http-ingress-port", git = "https://github.com/sweengineeringlabs/edge-transport-http-ingress.git", tag = "v0.9.3" }
swe-observ-metrics  = { package = "swe-observability-metrics", git = "ssh://git@github.com/sweengineeringlabs/observability.git", tag = "v0.2.9" }

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
tokio   = { version = "1.0", features = ["macros", "rt"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name                   = "swe-edge-bootstrap-metrics"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description = "swe-edge-bootstrap — Prometheus exposition ports (traits, zero implementation)"
keywords    = ["metrics", "prometheus", "ports"]
categories  = ["network-programming"]

[package.metadata.arch]
application_type = "port"
service_type     = "port"

[lib]
name = "swe_edge_bootstrap_metrics"
path = "src/lib.rs"

[dependencies]
swe-edge-bootstrap-monitor = { path = "../monitor" }
swe-edge-ingress-http = { package = "edge-transport-http-ingress-port", git = "https://github.com/sweengineeringlabs/edge-transport-http-ingress.git", rev = "f5bf97ca01a4528cfed02ad26dc8bb8914bcfd8d" }

[dev-dependencies]
swe-observ-metrics = { package = "swe-observability-metrics", git = "ssh://git@github.com/sweengineeringlabs/observability.git", tag = "v0.2.9" }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

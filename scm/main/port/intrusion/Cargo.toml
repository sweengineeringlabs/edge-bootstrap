[package]
name                   = "swe-edge-bootstrap-intrusion"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description = "swe-edge-bootstrap — intrusion-guard ports (traits, zero implementation)"
keywords    = ["intrusion", "ids", "ips", "ports"]
categories  = ["network-programming"]

[package.metadata.arch]
application_type = "port"
service_type     = "port"

[lib]
name = "swe_edge_bootstrap_intrusion"
path = "src/lib.rs"

[dependencies]
swe-edge-ingress-grpc = { package = "edge-transport-grpc-ingress-transport", git = "https://github.com/sweengineeringlabs/edge-transport-grpc-ingress.git", tag = "v0.9.5" }
swe-edge-ingress-http = { package = "edge-transport-http-ingress-port", git = "https://github.com/sweengineeringlabs/edge-transport-http-ingress.git", tag = "v0.10.1" }

[dev-dependencies]
futures = "0.3"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

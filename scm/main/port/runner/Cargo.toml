[package]
name                   = "swe-edge-bootstrap-runner"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description = "swe-edge-bootstrap — lifecycle driver port (trait contract, zero implementation)"
keywords    = ["runner", "lifecycle", "ports"]
categories  = ["network-programming"]

[package.metadata.arch]
application_type = "port"
service_type     = "port"

[lib]
name = "swe_edge_bootstrap_runner"
path = "src/lib.rs"

[dependencies]
swe-edge-bootstrap-runtime = { path = "../runtime" }

[dev-dependencies]
futures = "0.3"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

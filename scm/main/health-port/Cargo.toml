[package]
name                   = "swe-edge-bootstrap-health-port"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description = "swe-edge-bootstrap — runtime health endpoint port (trait contract, zero implementation)"
keywords    = ["health", "ports"]
categories  = ["network-programming"]

[package.metadata.arch]
application_type = "port"
service_type     = "port"

[lib]
name = "swe_edge_bootstrap_health_port"
path = "src/lib.rs"

[dependencies]
swe-edge-ingress-http = { package = "edge-transport-http-ingress-transport", git = "https://github.com/sweengineeringlabs/edge-ingress-http.git", tag = "v0.5.3" }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

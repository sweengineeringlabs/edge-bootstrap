[package]
name                   = "swe-edge-bootstrap-validator-port"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description = "swe-edge-bootstrap — domain validation ports (traits, zero implementation)"
keywords    = ["validation", "ports"]
categories  = ["network-programming"]

[package.metadata.arch]
application_type = "port"
service_type     = "port"

[lib]
name = "swe_edge_bootstrap_validator_port"
path = "src/lib.rs"

[dependencies]
swe-edge-bootstrap-runtime-port = { path = "../runtime-port" }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
